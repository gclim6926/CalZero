version: '3.8'

services:
  app:
    image: calzero:latest
    container_name: calzero
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=${SECRET_KEY}
      - DATA_DIR=/app/data
      - PYTHONUNBUFFERED=1
    volumes:
      - /mnt/calzero-data/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
